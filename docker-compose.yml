services:
  backend:
    image: omnirag-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnirag-backend-python
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload" ]
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./data/runtime:/app/data/runtime
      - ./data/documents:/app/backend/data/documents
      - ./data:/app/backend/data
      - model_cache:/home/appuser/.cache
    environment:
      PYTHONPATH: /app/backend
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      HOME: /home/appuser
      TMPDIR: /tmp
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - omnirag-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: omnirag-qdrant
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    networks:
      - omnirag-network

  frontend:
    image: omnirag-frontend:dev
    build:
      context: frontend
      dockerfile: Dockerfile
      target: development
    container_name: omnirag-frontend
    ports:
      - "5174:8000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api
      - VITE_APP_MOTTO=Talk To Your Doc
      - VITE_APP_NAME=OmniRAG
      - VITE_NODE_ENV=development
    networks:
      - omnirag-network
    depends_on:
      - backend
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: omnirag-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - omnirag-network
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
  n8n_data:

networks:
  omnirag-network:
    driver: bridge
