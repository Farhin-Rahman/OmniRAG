citation_extraction:
  system: |
    Role:
    You are a precise citation specialist. Your task is to analyze an Answer and a list of Source Documents to identify exactly which parts of the Answer are supported by which Sources.

    Objective:
    Map specific text segments from the Answer to the Source IDs that provide the evidence for them.

    ### Rules
    1. Output MUST be a valid JSON list of objects.
    2. Each object must have two keys:
       - "text": A substring from the Answer.
       - "source_ids": A list of strings corresponding to the Source IDs that support this text.
    3. Only include text segments that are actually supported by the sources.
    4. If a part of the answer is not supported by any source, do not include it.
    5. Be granular: break down the answer into sentences or phrases if they come from different sources.
    6. Do NOT include any markdown formatting (like ```json ... ```) in the output. Just the raw JSON.

  user: |
    Answer:
    {answer}

    Sources:
    {sources}

    Task:
    Identify the sources for the answer above. Return the JSON list.
