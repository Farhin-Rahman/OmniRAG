[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirag-backend"
version = "0.1.0"
description = "OmniRAG backend service"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core Framework
    "python-dotenv",
    "pydantic[email]",
    "pydantic-settings",
    "pyyaml",
    
    # Web Framework
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
    "firebase-admin",
    "langgraph",

    # Database & ORM
    "sqlalchemy",
    "alembic",
    "qdrant-client",

    # Document Processing
    "pypdf",
    "python-docx",
    "docx2txt",
    "PyMuPDF",

    # Text Processing
    "langdetect>=1.0.9",

    # HTTP Client
    "httpx",
    "requests",
    "numpy",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx",
]

ci = [
    "pytest",
    "httpx",
    "ruff",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "qdrant-client",
    "langgraph",
]

[tool.ruff.lint]
# Ruff's classic default rule set (pycodestyle errors + pyflakes). The
# codebase was written against this; later ruff releases widened their
# implicit defaults (import sorting, pyupgrade, ...), which is what made
# CI lint start failing with no code change. Pinning it keeps the check
# stable across ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately run code (env-var setup, sys.path, a chdir)
# before importing, so their module-level imports can't all be at the top.
"mcp_server.py" = ["E402"]
"moderation/eval/run_eval.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
