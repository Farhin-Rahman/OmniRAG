name: Lint and Test

on:
  push:
  pull_request:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install linting dependencies
        run: uv tool install ruff
      - name: Ruff check & format (check)
        run: |
          uv tool run ruff check backend/ ml-service/
          uv tool run ruff format --check backend/ ml-service/

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_NAME: omnirag
      APP_ENV: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_URL: sqlite:///./test.db
      NEO_USER: test
      NEO_PASSWORD: test
      NEO_DB: test
      NEO_URI: bolt://localhost:7687
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      QDRANT_URI: http://localhost:6333
      BLOB_STORAGE_DIR: data/blob_storage
      DOCUMENTS_DIR: data/documents
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install CI dependencies only
        working-directory: backend
        run: uv sync --group ci --frozen
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest tests

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
